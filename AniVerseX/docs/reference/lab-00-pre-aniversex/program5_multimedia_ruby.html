<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multimedia Page</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .grid { display: grid; gap: 12px; max-width: 820px; }
    .panel { border: 1px solid #ddd; padding: 12px; border-radius: 8px; }
    video, audio { width: 100%; height: auto; }
  </style>
</head>
<body>
<header class="panel">
  <h1>Audio + Video + Ruby + Embed</h1>
  <p>
    Ruby example:
    <ruby>水<rp>(</rp><rt>mizu</rt><rp>)</rp></ruby>
    means “water”.
  </p>
</header>

<main class="grid">
  <section class="panel">
    <h2>Audio</h2>
    <audio controls>
      <source src="sample-audio.mp3" type="audio/mpeg" />
      <source src="sample-audio.ogg" type="audio/ogg" />
      Your browser does not support audio.
    </audio>
    <p><small>Use your own file names in the same folder.</small></p>
  </section>

  <section class="panel">
    <h2>Video (with track)</h2>
    <video controls poster="poster.jpg">
      <source src="sample-video.mp4" type="video/mp4" />
      <source src="sample-video.webm" type="video/webm" />
      <track src="captions.vtt" kind="subtitles" srclang="en" label="English" default />
      Your browser does not support video.
    </video>
  </section>

  <section class="panel">
    <h2>Embed Example</h2>
    <p>This uses the <code>&lt;embed&gt;</code> tag (PDF/image).</p>
    <embed src="sample.pdf" type="application/pdf" width="100%" height="260" />
  </section>
</main>

<footer class="panel" style="margin-top:12px;">
  <p>Multimedia tags demo done.</p>
</footer>
</body>
</html>
