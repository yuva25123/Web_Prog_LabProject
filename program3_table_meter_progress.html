<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comparison Table</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .wrap { max-width: 760px; }
    table { width: 100%; border-collapse: collapse; }
    caption { text-align: left; font-weight: bold; margin: 8px 0; }
    th, td { border: 1px solid #bbb; padding: 10px; vertical-align: top; }
    tbody tr:nth-child(even) { background: #f4f4f4; }
    tbody tr:nth-child(odd) { background: #fff; }
    .tag { display: inline-block; padding: 2px 6px; border: 1px solid #aaa; border-radius: 6px; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Device Comparison</h1>
    <p>Simple table with <span class="tag">colspan</span> and <span class="tag">rowspan</span>.</p>
  </header>

  <main>
    <table>
      <caption>Comparison (Sample)</caption>
      <thead>
        <tr>
          <th>Item</th>
          <th>Battery</th>
          <th>Performance</th>
          <th>Progress</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="2"><strong>Laptop A</strong><br><small><time datetime="2026-01-05">Updated: Jan 5</time></small></td>
          <td><meter min="0" max="10" value="7">7/10</meter></td>
          <td><meter min="0" max="10" value="8">8/10</meter></td>
          <td><progress value="60" max="100"></progress> 60%</td>
        </tr>
        <tr>
          <td colspan="3">
            Notes: <mark>Good for coding</mark>, supports <u>fast compile</u>.
          </td>
        </tr>

        <tr>
          <td><strong>Laptop B</strong></td>
          <td><meter min="0" max="10" value="9">9/10</meter></td>
          <td><meter min="0" max="10" value="6">6/10</meter></td>
          <td><progress value="40" max="100"></progress> 40%</td>
        </tr>
      </tbody>
    </table>

    <section>
      <h2>Mini Notes</h2>
      <p><b>Bold</b>, <i>italic</i>, <em>emphasis</em>, <strong>strong</strong> tags used.</p>
    </section>
  </main>

  <footer>
    <p>End of table demo.</p>
  </footer>
</div>
</body>
</html>
